version: 2

models:
  - name: fct_upwork_performance
    description: "Fact table at contract grain consolidating agreed, transacted, and earned amounts."
    columns:
      - name: contract_id
        tests:
          - unique
          - not_null
      - name: client_hash_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_hash_id
      - name: start_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: agreed_amount
        tests:
          - not_null

  - name: dim_clients
    description: "Client dimension derived from anonymized Upwork contact records."
    columns:
      - name: client_hash_id
        tests:
          - unique
          - not_null

  - name: dim_dates
    description: "Continuous daily calendar dimension for time-intelligence reporting."
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
